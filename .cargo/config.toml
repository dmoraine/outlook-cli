# Windows build (cross-compiled from Linux/WSL with llvm-mingw, see
# scripts/setup-toolchain.sh). Static linking gives a self-contained .exe that
# only needs the UCRT shipped with Windows 10+.
[target.x86_64-pc-windows-gnullvm]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=-static"]

# Native Windows build (CI): link the C runtime statically as well.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
